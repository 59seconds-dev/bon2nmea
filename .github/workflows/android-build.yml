name: Android build validation
on:
  push:
    branches: [develop/bon4-workflow]
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      # ubuntu-latest already has the Android SDK; avoid legacy 'tools' package installation.
      - name: Verify Android SDK
        run: |
          echo "ANDROID_HOME=$ANDROID_HOME"
          test -d "$ANDROID_HOME/platforms/android-31" || "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-31"
      # Gradle 7.2 / Android Gradle Plugin 7.1.3 requires Java 11 for reliable builds.
      # Android SDK command line tools require Java 17 during SDK setup.
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '11'
      - name: Build debug APK
        run: bash ./gradlew assembleDevelopDebug --stacktrace
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: bon4-converter-debug
          path: app/build/outputs/apk/develop/debug/*.apk
